name: Backend CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: iaterap
          POSTGRES_USER: iaterap
          POSTGRES_PASSWORD: iaterap123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iaterap -d iaterap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python for FastAPI integration tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI service test dependencies
        run: python -m pip install --requirement ai-service/requirements.txt

      - name: Run backend test suite
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          # The job runs directly on the GitHub-hosted runner, so the mapped
          # service port is reached through localhost rather than the service
          # container hostname.
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/iaterap
          SPRING_DATASOURCE_USERNAME: iaterap
          SPRING_DATASOURCE_PASSWORD: iaterap123
        run: ./mvnw clean test
