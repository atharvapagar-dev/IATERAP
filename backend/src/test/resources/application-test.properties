# CI and local integration-test datasource. Values may be overridden by the
# SPRING_DATASOURCE_* variables supplied by the workflow.
spring.datasource.url=jdbc:postgresql://localhost:5432/iaterap
spring.datasource.username=iaterap
spring.datasource.password=iaterap123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.sql.init.mode=never
