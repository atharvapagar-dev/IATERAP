# CI and local integration-test datasource. Values may be overridden by the
# SPRING_DATASOURCE_* variables supplied by the workflow.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/iaterap}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:iaterap}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:iaterap123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.sql.init.mode=never
jwt.secret=${JWT_SECRET:test-only-signing-key-must-never-be-used-outside-tests}
