server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Container health must not depend on SPA fallback or a static asset.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
