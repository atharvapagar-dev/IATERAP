spring.application.name=backend

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


spring.sql.init.mode=never

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:60}
jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:7}

# Independent FastAPI advisory service. Docker overrides the host with its
# service name; local development and the cross-language test use loopback.
ai.advisory.base-url=${AI_ADVISORY_BASE_URL:http://127.0.0.1:8000}
ai.advisory.connect-timeout-ms=${AI_ADVISORY_CONNECT_TIMEOUT_MS:2000}
ai.advisory.read-timeout-ms=${AI_ADVISORY_READ_TIMEOUT_MS:5000}
