spring.application.name=backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/iaterap
spring.datasource.username=iaterap
spring.datasource.password=iaterap123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Flyway
spring.flyway.enabled=false


spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT
jwt.secret=iaterap-dev-jwt-signing-key-2026-32-bytes-min
jwt.access-token-ttl-minutes=60
jwt.refresh-token-ttl-days=7
